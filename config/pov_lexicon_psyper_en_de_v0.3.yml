context_rules: ['General terms like perspective, voice, narrator, character, showing, exposition, camera
    or scene need a narrative-specific phrase or a second independent contextual cue in the same window.',
  'Do not treat personal pronouns, ordinary perception verbs, generic dialogue or a fictional example
    as evidence that a manual discusses a concept.', 'For reader_effect, speech_dialogue and narrative_style_voice,
    require explicit relation to narrative perspective or a PsyPer-related concept.', Use contrast pairs
    and negated phrases as retrieval evidence; do not infer a passage endorses a technique., 'Use curated
    high-precision exact terms for Ngram, not every lexical or semantic expansion.', Keep lexical and
    semantic retrieval evidence separate; semantic similarity does not establish that a concept is discussed.]
