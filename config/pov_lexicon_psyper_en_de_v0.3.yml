# PsyPer bilingual retrieval lexicon v0.3 (draft).
# Additive to v0.2; does not replace config/pov_lexicon_psyper_en_de_v0.2.yml.
# Terms are candidate retrieval cues, not gold narratological labels.
# PsyPer mappings indicate potential relevance, not logical equivalence.
# evidence_overrides assign explicit evidence tiers independent of vocabulary origin.
# Provisional corpus-driven expansions require human confirmation.
version: 0.3-draft
languages: [en, de]
purpose: Retrieve discussion of narrative perspective in writing manuals, not annotate fictional examples.
matching: {academic: Specific phrases; rare terms may be strong candidates; ambiguous ones need context.,
  craft: Candidate terms used in practical instruction; require narrative context for ambiguous forms.,
  paraphrases: Match normalized phrases or use as semantic queries; do not count semantic similarity as
    literal frequency., context: Supporting cues only; never retrieve a passage on these words alone.,
  scope: Paragraph or 2–3 sentences; retain surrounding context; do not match across chapter boundaries.,
  normalization: 'NFKC, Unicode quotes/dashes, soft hyphen removal, conservative line-break dehyphenation,
    case-folding, German inflection and compounds.', aggregation: 'Deduplicate overlapping spans by concept;
    preserve matched form, concept ID and all evidence; report counts per 10000 body words.', corpus_membership: 'Independent
    of lexicon hits; unreadable or unavailable text is unknown, not zero.', ngram: 'Use only literal,
    short, sufficiently specific forms, with language-specific spelling and inflection variants; measure
    separately from manual corpus.', undeterminable: 'PsyPer 0/0.1/0.2 are uncertainty labels, not concept
    retrieval categories.'}
concepts:
- id: perspective_general
  psyper: [A, B, C, D, E, F]
  note: Umbrella terminology; no specific category inferred.
  en:
    academic: [narrative perspective, narrative point of view, narrative viewpoint, perspectivization,
      narrative situation, narratorial perspective, narrative perspective-taking]
    craft: [point of view, POV, viewpoint, viewpoint character, perspective character, POV character,
      story perspective, narrative lens, narrative angle, narrative stance, narrative camera, choice of
        perspective, choice of viewpoint]
    paraphrases: [who tells the story, who is telling the story, from whose point of view, from whose
        perspective, whose story is it, whose eyes we see through, who should narrate the story, choose
        a point of view, decide who tells the story, choose the right perspective]
    context: [perspective, angle, lens, position, standpoint, view]
  de:
    academic: [Erzählperspektive, Erzählstandpunkt, Erzählerstandort, Erzählsituation, Erzählhaltung,
      Perspektivierung, narrative Perspektive, Erzählposition, Perspektivenstruktur]
    craft: [Blickwinkel, Blickpunkt, Perspektivfigur, Erzählfigur, Erzählblick, Erzähloptik, Erzählkamera,
      Perspektivenwahl, Wahl der Erzählperspektive, Erzählform, Erzählweise]
    paraphrases: [wer erzählt die Geschichte, aus wessen Sicht, aus wessen Perspektive, durch wessen Augen,
      wer soll erzählen, wessen Geschichte wird erzählt, die passende Perspektive wählen, die Erzählperspektive
        festlegen, aus welchem Blickwinkel erzählt wird]
    context: [Perspektive, Sichtweise, Blick, Standpunkt, Blickrichtung, Position, Sicht]
