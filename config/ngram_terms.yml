# Each group is one Ngram query; keep groups <= 12 terms (Viewer limit).
# Run: python -m src.ngrams --group <key> --corpus en|de|eng_2019|ger_2019

# Corpus-boundary terms: used to argue for the temporal range.
english_corpus_terms:
  - creative writing
  - writing fiction
  - fiction writing
  - novel writing
  - writing a novel
  - craft of fiction
  - art of fiction
  - creative-writing course

german_corpus_terms:
  - kreatives Schreiben
  - literarisches Schreiben
  - Romane schreiben
  - Roman schreiben
  - Schreibschule
  - Schreibwerkstatt
  - Erzähltechnik
  - Schriftstellerei

# Older German labels for instructional writing discourse (pre-1970 prehistory).
german_historical_terms:
  - Technik des Erzählens
  - Technik des Romans
  - Erzählkunst
  - Dichtkunst
  - Romantechnik
  - Schriftstellerei
  - Schreibkunst

