# Starters from 2026-10-10 DNB practice (oai_dc subjects are mostly DDC-style labels).
# Refine after MARC21 / GND subject harvests and HeBIS seed holdings.
subject_headings:
  dnb_gnd:
    - Kreatives Schreiben
    - Schriftstellerei
    - Erzähltechnik
    - Rhetorik
  ddc:
    - "800"   # Literatur, Rhetorik, Literaturwissenschaft (common on craft hits)
    - "808"   # Rhetorik / literary technique (target for fiction-writing manuals)
    - "830"   # Deutsche Literatur
    - "370"   # Erziehung (often pedagogy noise — use for exclusion flags)
  lcsh:
    - Creative writing
    - Fiction--Authorship
    - Narration (Rhetoric)
